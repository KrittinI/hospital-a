version: "3.8"

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: hospital-a
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  go-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: development
      SERVER_ADDRESS: ":8080"
      CORS_ALLOWED_ORIGIN: "*"
      DB_DRIVER: postgres
      DB_SOURCE: "postgres://admin:admin1234@postgres:5432/hospital-a?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      - postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data: